<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20aria-hidden%3D%22true%22%20focusable%3D%22false%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22f-oro%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ffe9a8%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23f7c948%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23c98a12%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22f-loseta%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231b2639%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23070b12%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2262%22%20height%3D%2262%22%20rx%3D%2215%22%20fill%3D%22url%28%23f-loseta%29%22%20stroke%3D%22%23f7c948%22%20stroke-opacity%3D%22.3%22%2F%3E%3Cpath%20d%3D%22M13.2%2052.5L29.4%2012.6L34.6%2012.6L50.8%2052.5L42.4%2052.5L32%2025.2L21.6%2052.5Z%22%20fill%3D%22url%28%23f-oro%29%22%2F%3E%3Cpath%20d%3D%22M18.3%2037.6C22.9%2031.3%2041.1%2031.3%2045.7%2037.6C41.1%2043.9%2022.9%2043.9%2018.3%2037.6Z%22%20fill%3D%22url%28%23f-oro%29%22%20stroke%3D%22%230b1220%22%20stroke-width%3D%222.4%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M25.8%2037.6L38.2%2037.6M28.8%2035.4L28.8%2039.8M32%2035.4L32%2039.8M35.2%2035.4L35.2%2039.8%22%20stroke%3D%22%230b1220%22%20stroke-width%3D%221.55%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E">
<title>Prueba de conexión · ANGABAVE</title>
<style>
:root{ --bg:#041009; --panel:#102117; --panel2:#162a1f; --linea:#1d3728; --txt:#eef5f0; --tenue:#93a69a;
  --oro:#f7c948; --verde:#3ddc84; --rojo:#ff6058; --ambar:#ffb547; color-scheme:dark }
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg); color:var(--txt); font:15px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
main{max-width:560px; margin:0 auto; padding:24px 16px 40px}
h1{font-size:1.3rem; margin:0 0 .3rem} p{margin:.3rem 0} .tenue{color:var(--tenue); font-size:.88rem}
ol{list-style:none; padding:0; margin:16px 0; display:grid; gap:8px}
li{background:var(--panel); border:1px solid var(--linea); border-radius:12px; padding:12px 14px}
li b{display:block} li small{display:block; color:var(--tenue); margin-top:2px; word-break:break-word}
.ok b{color:var(--verde)} .mal b{color:var(--rojo)} .espera b{color:var(--ambar)}
button{appearance:none; border:0; border-radius:12px; background:var(--oro); color:#171203; font:inherit;
  font-weight:800; width:100%; min-height:48px; margin-top:6px; cursor:pointer}
.caja{background:var(--panel2); border-radius:12px; padding:10px 12px; margin-top:12px; font-size:.82rem;
  color:var(--tenue); word-break:break-word}
</style>
</head>
<body>
<main>
  <h1>Prueba de conexión</h1>
  <p class="tenue">Revisa, desde este teléfono y esta red, cada conexión que usan las páginas de ANGABAVE. Si algo sale en rojo, mándale a Angel una captura de toda la pantalla.</p>
  <ol id="lista"></ol>
  <button type="button" id="otra">Repetir la prueba</button>
  <div class="caja" id="equipo"></div>
  <p class="tenue" style="margin-top:14px">alfa v0.21.0</p>
</main>
<script>
/* A propósito sin sintaxis moderna (nada de flechas ni const): esta página
   tiene que correr justo donde las otras fallan. */
(function () {
  var FUNCION = "https://hxaajhsizdnlismnelqu.supabase.co/functions/v1/angabave-carga";
  var ESPN = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard";
  var ESPERA = 20000;
  var lista = document.getElementById("lista");

  var pruebas = [
    { nombre: "Aviso de versión (version.json)", url: "version.json", leer: "version" },
    { nombre: "Portal completo (index.html)", url: "index.html", leer: "pagina" },
    { nombre: "Página del enlace (cargar.html)", url: "cargar.html", leer: "pagina" },
    { nombre: "Servidor de cargas (Supabase)", url: FUNCION + "?que=quien", esperado: 401 },
    { nombre: "Marcadores en vivo (ESPN)", url: ESPN, leer: "nada" }
  ];

  function renglon(texto) {
    var li = document.createElement("li");
    li.className = "espera";
    var b = document.createElement("b");
    b.appendChild(document.createTextNode("⏳ " + texto));
    var s = document.createElement("small");
    s.appendChild(document.createTextNode("probando…"));
    li.appendChild(b);
    li.appendChild(s);
    lista.appendChild(li);
    return { li: li, b: b, s: s };
  }

  function poner(r, bien, titulo, detalle) {
    r.li.className = bien ? "ok" : "mal";
    r.b.textContent = (bien ? "✅ " : "❌ ") + titulo;
    r.s.textContent = detalle;
  }

  function probar(prueba, hecho) {
    var r = renglon(prueba.nombre);
    var inicio = Date.now();
    var terminado = false;
    var control = window.AbortController ? new AbortController() : null;
    var reloj = setTimeout(function () {
      if (terminado) return;
      terminado = true;
      if (control) control.abort();
      poner(r, false, prueba.nombre, "Sin respuesta en " + (ESPERA / 1000) + " s.");
      hecho();
    }, ESPERA);
    var url = prueba.url + (prueba.url.indexOf("?") >= 0 ? "&" : "?") + "prueba=" + Date.now();
    var opciones = { cache: "no-store" };
    if (control) opciones.signal = control.signal;
    fetch(url, opciones).then(function (respuesta) {
      return respuesta.text().then(function (texto) {
        if (terminado) return;
        terminado = true;
        clearTimeout(reloj);
        var ms = Date.now() - inicio;
        var nodo = respuesta.headers.get("x-served-by") || "";
        var edad = respuesta.headers.get("age");
        var partes = ["HTTP " + respuesta.status, Math.round(texto.length / 1024) + " KB", ms + " ms"];
        if (prueba.leer === "version") {
          try { partes.push("versión " + JSON.parse(texto).version); } catch (e) { partes.push("respuesta ilegible"); }
        }
        if (prueba.leer === "pagina") {
          var v = texto.match(/alfa v\d+\.\d+\.\d+/i);
          partes.push(v ? v[0] : "sin versión (¿página incompleta?)");
        }
        if (nodo) partes.push("nodo " + nodo.split(",").pop().trim());
        if (edad) partes.push("en caché hace " + edad + " s");
        var bien = prueba.esperado ? respuesta.status === prueba.esperado : respuesta.ok;
        poner(r, bien, prueba.nombre, partes.join(" · "));
        hecho();
      });
    }).catch(function (error) {
      if (terminado) return;
      terminado = true;
      clearTimeout(reloj);
      poner(r, false, prueba.nombre, "No se pudo conectar (" + ((error && error.message) || error) + ") a los " + (Date.now() - inicio) + " ms.");
      hecho();
    });
  }

  function correr() {
    while (lista.firstChild) lista.removeChild(lista.firstChild);
    var i = 0;
    (function siguiente() {
      if (i < pruebas.length) probar(pruebas[i++], siguiente);
    })();
  }

  var equipo = document.getElementById("equipo");
  equipo.appendChild(document.createTextNode(
    "Teléfono: " + navigator.userAgent + " · Hora: " + new Date().toLocaleString("es-MX")
  ));
  document.getElementById("otra").addEventListener("click", correr);
  correr();
})();
</script>
</body>
</html>
