name: Cargar semana
description: Para quien reparte la quiniela. Adjunta el archivo de la semana y el portal se actualiza solo.
title: Cargar semana
labels: [carga]
body:
  - type: markdown
    attributes:
      value: |
        Adjunta el archivo tal como lo repartes, Excel o PDF: la semana completa o solo una tanda, como la del jueves.

        En uno o dos minutos te contesto aquí mismo: o quedó publicado, o te digo exactamente qué corregir. Si algo no cuadra, no se toca nada.
  - type: textarea
    id: archivo
    attributes:
      label: Archivo de la semana
      description: Arrástralo al recuadro, o tócalo y usa el botón para adjuntar. Un archivo por vez; espera a que termine de subir antes de enviar.
    validations:
      required: true
