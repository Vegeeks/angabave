name: Cargar semana

# Recibe la quiniela de la semana por dos caminos y la revisa igual en los dos
# (quiniela/carga.py):
#
# * El enlace personal. Quien no tiene cuenta de GitHub sube el archivo desde
#   una página del portal; la función angabave-carga de Supabase lo guarda y
#   dispara este workflow con la carga. Aquí se baja, se revisa, se publica y
#   se le devuelve el resultado a la función, que es lo que ve la página.
# * La forma "Cargar semana" de Issues, para quien sí tiene cuenta y está en
#   data/cargadores.json. Se le contesta en el mismo hilo.
#
# Seguridad:
# * El texto de un hilo nunca se pega en un comando: Python lo lee del archivo
#   del evento. La carga del enlace entra por variable y Python revisa su forma.
# * El secreto que comparte este workflow con la función solo existe en el
#   camino del enlace: un hilo abierto por cualquiera nunca lo tiene a mano.
# * El código que corre es siempre el de main.
# * Si algo no cuadra no se publica nada, y quien subió el archivo se entera.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      carga:
        description: "La manda la función del enlace; no se escribe a mano"
        required: true
        type: string

permissions:
  contents: write   # publicar los picks y el sitio
  issues: write     # contestar y cerrar el hilo
  actions: write    # despertar el directo si hay partido pronto

jobs:
  cargar:
    # Los hilos de la forma traen la etiqueta. Por si GitHub no la pusiera, se
    # reconoce también el encabezado que la forma escribe en el texto.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'carga') ||
      contains(github.event.issue.body, '### Archivo de la semana')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NUMERO: ${{ github.event.issue.number }}
      CARGA: ${{ inputs.carga }}
      ANGABAVE_SECRETO: ${{ github.event_name == 'workflow_dispatch' && secrets.ANGABAVE_SECRETO || '' }}
      FORMA: ${{ github.server_url }}/${{ github.repository }}/issues/new?template=cargar-semana.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar, publicar y contestar
        run: |
          git config user.name "Angel Barrera"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REPORTE="$RUNNER_TEMP/reporte.md"
          RESUMEN="$RUNNER_TEMP/resumen.json"
          CONTESTADO="$RUNNER_TEMP/contestado"

          # contestar ok|rechazo|falla [nota]
          contestar() {
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              case "$1" in ok) estado=listo ;; rechazo) estado=rechazado ;; *) estado=falla ;; esac
              if [ -n "${2:-}" ]; then
                python cli.py enlace contestar --carga "$CARGA" --estado "$estado" --resumen "$RESUMEN" --nota "$2"
              else
                python cli.py enlace contestar --carga "$CARGA" --estado "$estado" --resumen "$RESUMEN"
              fi
            else
              [ -n "${2:-}" ] && printf '\n---\n⚠️ %s\n' "$2" >> "$REPORTE"
              gh issue comment "$NUMERO" --body-file "$REPORTE"
              if [ "$1" = ok ]; then razon=completed; else razon="not planned"; fi
              gh issue close "$NUMERO" --reason "$razon"
            fi
            touch "$CONTESTADO"
          }

          # Los comandos devuelven 0 si todo bien, 1 si hubo que rechazar algo
          # del archivo o del hilo (se contesta y el workflow queda en verde) y
          # 3 si algo falló de este lado (se contesta y queda en rojo, para que
          # llegue el aviso).
          terminar_si_fallo() {
            if [ "$1" -eq 0 ]; then return; fi
            if [ "$1" -eq 1 ]; then contestar rechazo; exit 0; fi
            contestar falla
            exit 1
          }

          # 1. De dónde viene el archivo.
          set +e
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python cli.py enlace bajar --carga "$CARGA" --carpeta "$RUNNER_TEMP/entrada" \
              --salida "$RUNNER_TEMP/archivo.txt" --cargador "$RUNNER_TEMP/cargador.txt"
            codigo=$?
            [ "$codigo" -ne 0 ] && codigo=3
            ORIGEN="con el enlace de $(cat "$RUNNER_TEMP/cargador.txt" 2>/dev/null || echo 'sin nombre')"
          else
            python cli.py buzon --evento "$GITHUB_EVENT_PATH" --carpeta "$RUNNER_TEMP/entrada" \
              --reporte "$REPORTE" --salida "$RUNNER_TEMP/archivo.txt" --forma "$FORMA"
            codigo=$?
            ORIGEN="desde #$NUMERO"
          fi
          set -e
          terminar_si_fallo "$codigo"
          ARCHIVO="$(cat "$RUNNER_TEMP/archivo.txt")"

          # 2. Revisar y publicar. Si otra corrida publica en medio, se vuelve a
          #    revisar todo encima de lo que ella dejó: nunca se sube una
          #    revisión hecha contra datos viejos.
          for intento in 1 2 3 4; do
            set +e
            python cli.py importar "$ARCHIVO" \
              --reporte "$REPORTE" --resumen "$RESUMEN" --forma "$FORMA"
            codigo=$?
            set -e
            terminar_si_fallo "$codigo"

            if [ -z "$(git status --porcelain -- data/picks data/sellos.json)" ]; then
              contestar ok   # ya estaba igual
              exit 0
            fi
            SEMANA="$(jq -r '.semana' "$RESUMEN")"

            if ! python cli.py actualizar; then
              contestar falla "El archivo está bien, pero no pude regenerar el portal (seguramente ESPN no respondió), así que no publiqué nada. Vuelve a subirlo en unos minutos."
              exit 1
            fi

            git add data/picks data/sellos.json docs data/resultados
            git commit -q -m "Semana $SEMANA cargada $ORIGEN"
            if git push -q; then
              # Si hay partido en las próximas 12 horas, que el directo no
              # dependa del cron de GitHub para arrancar.
              PROXIMO="$(python cli.py proximo 2>/dev/null || echo -1)"
              if [ "$PROXIMO" -ge 0 ] 2>/dev/null && [ "$PROXIMO" -le 43200 ]; then
                gh workflow run directo.yml --repo "$GITHUB_REPOSITORY" || true
              fi
              contestar ok
              exit 0
            fi
            echo "Otra corrida publicó primero; reviso otra vez encima ($intento)."
            git fetch -q origin main
            git reset -q --hard origin/main
          done

          contestar falla "No pude publicar después de varios intentos. No se tocó nada."
          exit 1

      - name: Contestar aunque algo truene
        if: failure()
        run: |
          # Si el paso anterior alcanzó a contestar, no se repite.
          [ -f "$RUNNER_TEMP/contestado" ] && exit 0
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python cli.py enlace contestar --carga "$CARGA" --estado falla
          elif [ "$(gh issue view "$NUMERO" --json state --jq .state)" = "OPEN" ]; then
            printf '### ⚠️ No pude terminar de revisar el archivo\n\nAlgo falló de mi lado, no en tu archivo. No se tocó nada y Angel ya tiene el aviso.\n' > "$RUNNER_TEMP/fallo.md"
            gh issue comment "$NUMERO" --body-file "$RUNNER_TEMP/fallo.md"
            gh issue close "$NUMERO" --reason "not planned"
          fi
