name: Actualizar quiniela

# Cada 5 minutos, que es el mínimo que permite GitHub. Aun así el programador
# de GitHub se retrasa cuando hay carga, así que el sitio no depende de esto
# para el marcador en vivo: el navegador consulta ESPN por su cuenta.
#
# Ciudad de México está fija en UTC-6 todo el año (México eliminó el horario de
# verano en 2022), así que el ajuste es sumar 6 horas a la hora local:
#
#   jueves  18:00-23:59 CDMX  ->  viernes 00:00-05:59 UTC   (cron: día 5)
#   domingo 11:00-17:59 CDMX  ->  domingo 17:00-23:59 UTC   (cron: día 0)
#   domingo 18:00-23:59 CDMX  ->  lunes   00:00-05:59 UTC   (cron: día 1)
#   lunes   18:00-23:59 CDMX  ->  martes  00:00-05:59 UTC   (cron: día 2)
on:
  schedule:
    - cron: "*/5 0-5 * * 5"
    - cron: "*/5 17-23 * * 0"
    - cron: "*/5 0-5 * * 1"
    - cron: "*/5 0-5 * * 2"
  workflow_dispatch:
    inputs:
      semana:
        description: "Número de semana (vacío = la última con picks)"
        required: false
        type: string
  push:
    paths:
      - "data/picks/**"
      - "data/overrides.json"

# GitHub Pages publica solo, con cada commit a docs/: basta con poder escribir.
permissions:
  contents: write

# Nunca dos corridas a la vez: se pisarían el commit.
concurrency:
  group: quiniela
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calcular y publicar
        # Sin "continue-on-error": si el cálculo truena, el workflow se ve en
        # rojo y no se publica una tabla vieja como si fuera buena.
        env:
          SEMANA: ${{ inputs.semana }}
        run: |
          git config user.name "Angel Barrera"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Si otra corrida publica mientras esta calcula (el cron y una carga
          # de picks, por ejemplo), se recalcula encima de lo que ella dejó.
          # Nunca se reintenta con "reset --soft": eso volvía a subir los
          # archivos viejos de esta corrida y deshacía en silencio lo que la
          # otra hubiera cambiado, incluidos los picks.
          for intento in 1 2 3; do
            if [ -n "$SEMANA" ]; then
              python cli.py actualizar --semana "$SEMANA"
            else
              python cli.py actualizar
            fi

            # Los sellos también: si no se suben, el de un partido que acaba de
            # arrancar se pierde al terminar el job.
            git add docs data/resultados data/sellos.json
            if git diff --staged --quiet; then
              echo "Sin cambios que publicar."
              exit 0
            fi
            git commit -q -m "Actualiza tablas: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push -q; then
              echo "Publicado."
              exit 0
            fi
            echo "Otra corrida publicó primero; recalculo encima de lo publicado ($intento)."
            git fetch -q origin main
            git reset -q --hard origin/main
          done

          echo "No pude publicar después de 3 intentos." >&2
          exit 1
