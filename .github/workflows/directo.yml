name: Directo

# El cron de GitHub no es de fiar: tardó horas en activarse en este repo, llega
# de 2 a 5 horas tarde y a veces se salta corridas. Y la NFL también juega miércoles,
# viernes y sábados. Así que este workflow se despierta todos los días, sin
# importar el calendario, y él mismo decide:
#
#   1. Le pregunta a ESPN si cambió algo (un horario que se definió, un partido
#      que se movió) y luego cuándo es el próximo partido.
#   2. Si está a más de 12 horas, o no queda ninguno, se detiene. Es un minuto
#      de trabajo: no se queda encendido toda la semana.
#   3. Si está cerca, duerme hasta unos minutos antes y se pone a recalcular
#      cada dos minutos, solo mientras haya un partido en curso.
#   4. Si no cabe (un job dura como máximo 6 horas), duerme lo que puede y lanza
#      el siguiente eslabón antes de morir.
#
# Cada seis horas con un retraso de hasta cinco, siempre cae al menos una corrida
# en las 12 horas antes de cualquier partido. El minuto 17 es a propósito: GitHub
# avisa que la hora en punto es cuando más se retrasa o descarta.
on:
  schedule:
    - cron: "17 0,6,12,18 * * *"   # 18:17, 00:17, 06:17 y 12:17 en CDMX
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de vida de este eslabón"
        required: false
        default: "300"
      cada:
        description: "Segundos entre cada recálculo"
        required: false
        default: "120"
      eslabon:
        description: "Número de eslabón (interno, no tocar)"
        required: false
        default: "1"

# contents para publicar, actions para poder encadenar el siguiente eslabón.
permissions:
  contents: write
  actions: write

concurrency:
  group: quiniela-directo
  cancel-in-progress: false

jobs:
  directo:
    runs-on: ubuntu-latest
    # El tope de un job en GitHub es de 6 horas; nos quedamos debajo.
    timeout-minutes: 330
    env:
      MINUTOS: ${{ inputs.minutos || '300' }}
      CADA: ${{ inputs.cada || '120' }}
      ESLABON: ${{ inputs.eslabon || '1' }}
      MAX_ESLABONES: "6"
      # Si el próximo partido está más lejos que esto, no vale la pena seguir:
      # la siguiente corrida programada lo alcanza a tiempo.
      VENTANA: "43200"   # 12 horas
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Seguir la jornada
        id: jornada
        run: |
          git config user.name "Angel Barrera"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publicar() {
            git add docs data/resultados data/sellos.json
            if git diff --staged --quiet; then
              echo "Sin cambios en esta vuelta."
              return 1
            fi
            git commit -q -m "Directo: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push -q; then
              echo "Publicado."
              return 0
            fi
            echo "Otra corrida se adelantó; la próxima vuelta lo recoge."
            return 1
          }

          sincronizar() {
            # Cada vuelta arranca de lo publicado: así un arreglo o un Excel
            # nuevo entran sin reiniciar el directo.
            git fetch -q origin main
            git reset -q --hard origin/main
          }

          LIMITE=$(( $(date -u +%s) + MINUTOS * 60 ))
          echo "Eslabón $ESLABON de máximo $MAX_ESLABONES."

          # Si esta corrida se quedó en cola, su copia ya es vieja. Y si ESPN no
          # contesta ahorita no se publica nada: el próximo partido se calcula
          # con el último calendario guardado.
          sincronizar
          if python cli.py actualizar; then
            publicar || true
          else
            echo "No pude consultar ESPN en este arranque; sigo con lo que hay."
          fi

          VUELTA=0
          while [ "$(date -u +%s)" -lt "$LIMITE" ]; do
            PROXIMO=$(python cli.py proximo 2>/dev/null || echo -1)
            echo "Próximo partido en $PROXIMO segundos."

            if [ "$PROXIMO" -lt 0 ]; then
              echo "No queda ningún partido por seguir."
              exit 0
            fi

            if [ "$PROXIMO" -gt "$VENTANA" ]; then
              echo "El próximo partido está a más de $(( VENTANA / 3600 )) horas. Me detengo."
              exit 0
            fi

            # Sin partido en curso no hay nada que recalcular: se despierta
            # cinco minutos antes del saque inicial.
            ESPERA=$(( PROXIMO - 300 ))
            if [ "$ESPERA" -gt 0 ]; then
              MARGEN=$(( LIMITE - $(date -u +%s) - 120 ))
              if [ "$ESPERA" -ge "$MARGEN" ]; then
                echo "No alcanzo el partido en este eslabón: duermo $(( MARGEN / 60 )) min y encadeno."
                [ "$MARGEN" -gt 0 ] && sleep "$MARGEN"
                echo "encadenar=si" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Duermo $(( ESPERA / 60 )) min hasta el arranque."
              sleep "$ESPERA"
            fi

            VUELTA=$(( VUELTA + 1 ))
            echo "── vuelta $VUELTA · $(date -u '+%H:%M:%S UTC') ──"
            sincronizar
            python cli.py actualizar
            publicar || true
            sleep "$CADA"
          done

          echo "Se acabó el tiempo de este eslabón."
          echo "encadenar=si" >> "$GITHUB_OUTPUT"

      - name: Encadenar el siguiente eslabón
        if: steps.jornada.outputs.encadenar == 'si' && fromJSON(env.ESLABON) < fromJSON(env.MAX_ESLABONES)
        run: |
          SIGUIENTE=$(( ESLABON + 1 ))
          echo "Lanzando el eslabón $SIGUIENTE."
          gh workflow run directo.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f minutos="$MINUTOS" -f cada="$CADA" -f eslabon="$SIGUIENTE"
