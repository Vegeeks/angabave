name: Pruebas

# Las pruebas en el mismo Python con el que se publica (3.11), cada vez que cambia el
# código. En la Mac corren con otro Python: lo que solo truena aquí, aquí se ve. Si
# fallan, se abre un aviso en Issues para que le llegue a Angel.
on:
  push:
    branches: [main]
    paths:
      - "quiniela/**"
      - "cli.py"
      - "tests/**"
      - "herramientas/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      probar_aviso:
        description: "Fallar a propósito para comprobar que llega el aviso"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write     # avisar a Angel si algo falla

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr las pruebas
        run: python -m pytest -q

      - name: Falla de prueba
        if: inputs.probar_aviso
        run: |
          echo "Falla pedida a mano para probar el aviso."
          exit 1

      # Un solo aviso por incidente: si ya hay uno abierto, no se repite cada 5 minutos.
      - name: Avisar a Angel si algo falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titulo="Falla en $GITHUB_WORKFLOW"
          abiertos=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$titulo\" in:title" --json number --jq 'length')
          if [ "$abiertos" != "0" ]; then
            echo "Ya hay un aviso abierto."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" --body "La corrida $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID falló el $(TZ=America/Mexico_City date '+%d/%m a las %H:%M'), hora de Ciudad de México. Cuando quede resuelto, cierra este aviso para que el siguiente vuelva a llegar."
